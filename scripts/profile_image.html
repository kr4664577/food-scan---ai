<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodScan image preparation benchmark (development only)</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:16px}button{padding:12px}img{width:45%;vertical-align:top}pre{white-space:pre-wrap}</style>
<h1>Image preparation benchmark</h1>
<p>Public sample image only. No AI requests, nutrition results, account access, or history writes.</p>
<button id="run">Benchmark 4032px sample</button>
<pre id="results" aria-live="polite">Ready</pre>
<img id="original" alt="Original public sample"><img id="optimized" alt="Prepared image">
<script type="module">
import { prepareImage } from '../src/utils/imageUtils.ts';
import { beginCapture, imageReady, scanTimings } from '../src/utils/scanPerformance.ts';
const output = document.querySelector('#results');
document.querySelector('#run').onclick = async (event) => {
  event.target.disabled = true;
  output.textContent = 'Fetching public sample…';
  try {
    const response = await fetch('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=4032&auto=format&fit=crop&q=90');
    if (!response.ok) throw new Error('Sample download failed');
    const blob = await response.blob();
    document.querySelector('#original').src = URL.createObjectURL(blob);
    // Download is excluded: a gallery selection already exists on-device.
    beginCapture();
    const prepared = await prepareImage(blob);
    imageReady(prepared);
    document.querySelector('#optimized').src = prepared;
    output.textContent = JSON.stringify({ inputBytes: blob.size, ...scanTimings() }, null, 2);
  } catch { output.textContent = 'Benchmark failed. Check network access to the public sample.'; }
  finally { event.target.disabled = false; }
};
</script></html>
